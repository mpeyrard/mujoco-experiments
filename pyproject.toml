[project]
name = "mujoco-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthew Peyrard", email = "matt.peyrard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "glfw>=2.11.0",
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "mediapy>=1.2.7",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "pyopengl>=3.1.10",
    "scipy>=1.18.1",
]

[project.scripts]
mujoco-experiments = "mujoco_experiments:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
